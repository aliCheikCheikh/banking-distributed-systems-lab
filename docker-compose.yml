services:
  kafka:
    image: apache/kafka:4.2.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  notification-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?copy .env.example to .env}
    ports:
      - "${NOTIFICATION_DB_HOST_PORT:-5432}:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic ${ACCOUNT_EVENTS_TOPIC:-account-events} \
          --partitions 3 \
          --replication-factor 1

  account-service:
    build:
      context: .
      dockerfile: docker/account-service.Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_EVENTS_TOPIC: ${ACCOUNT_EVENTS_TOPIC:-account-events}
      ACCOUNT_HTTP_PORT: 8080
    ports:
      - "${ACCOUNT_HOST_PORT:-8080}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service.Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-postgres:5432/notification_db
      NOTIFICATION_DB_USERNAME: notification_user
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?copy .env.example to .env}
      ACCOUNT_EVENTS_TOPIC: ${ACCOUNT_EVENTS_TOPIC:-account-events}
      NOTIFICATION_KAFKA_GROUP_ID: ${NOTIFICATION_KAFKA_GROUP_ID:-notification-service}
      NOTIFICATION_KAFKA_CONCURRENCY: 3
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      notification-postgres:
        condition: service_healthy

volumes:
  notification_postgres_data:
